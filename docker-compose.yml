services:
  # --- Go Backend API ---
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8081:8080"
    environment:
      APP_PORT: "8080"
      DATABASE_URL: "postgres://postgres:password@postgres:5432/gotest_agent?sslmode=disable"
      REDIS_URL: "redis:6379"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      STEEL_API_URL: "http://steel-browser:3000"
      STEEL_API_KEY: "${STEEL_API_KEY:-}"
      LANGGRAPH_URL: "http://langgraph-sidecar:8000"
      API_KEY: "${API_KEY:-}"
      LLM_MODEL: "${LLM_MODEL:-claude-sonnet-4-5}"
      MAX_FIX_ATTEMPTS: "3"
      SCREENSHOTS_PATH: "/data/screenshots"
      REPORTS_PATH: "/data/reports"
      TRACING_ENABLED: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger:4317"
      SERVICE_VERSION: "1.0.0"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - app_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 3

  # --- Next.js Frontend ---
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:8081"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 3

  # --- PostgreSQL ---
  # No public port — internal Docker network only (AUDIT SEC-03).
  # Use docker-compose exec postgres psql for direct access.
  postgres:
    image: postgres:16.14-alpine
    environment:
      POSTGRES_DB: gotest_agent
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      start_period: 5s
      retries: 5

  # --- Redis ---
  # No public port — internal Docker network only (AUDIT SEC-03/D3).
  # The async job queue is not yet wired to cmd/server.
  redis:
    image: redis:7-alpine
    ports: []
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      start_period: 3s
      retries: 3

  # --- Steel Browser (self-hosted, EXPERIMENTAL) ---
  steel-browser:
    image: ghcr.io/steel-dev/steel-browser:latest
    # Internal-only: remove port mapping in production (AUDIT SEC-03/D3)
    ports:
      - "3010:3000"
    environment:
      STEEL_API_PORT: "3000"
      MAX_CONCURRENT_SESSIONS: "10"
      SESSION_TIMEOUT: "300000"
      BLOCK_ADS: "true"
    volumes:
      - /dev/shm:/dev/shm
    shm_size: "2gb"
    cap_add:
      - SYS_ADMIN
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 3

  # --- Jaeger Distributed Tracing ---
  # Accepts OTLP traces from backend, provides UI for trace visualization
  jaeger:
    image: jaegertracing/all-in-one:latest
    ports:
      - "16686:16686"  # Jaeger UI
      - "4317:4317"    # OTLP gRPC endpoint
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:16686/"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 3

  # --- LangGraph Python Sidecar (internal network only — see ADR-005 Phase 3)
  langgraph-sidecar:
    build:
      context: ./sidecar
      dockerfile: Dockerfile
    # No public port — internal Docker network only. Backend communicates via internal DNS.
    environment:
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      GOTEST_API_URL: "http://backend:8080"
      API_KEY: "${API_KEY:-}"
      SIDECAR_AUTH_TOKEN: "${SIDECAR_AUTH_TOKEN:-}"
      SIDECAR_JOBS_DB: "/data/jobs.sqlite3"
    volumes:
      - sidecar_jobs:/data
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  pgdata:
  app_data:
  sidecar_jobs:
