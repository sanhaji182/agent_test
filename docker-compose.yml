services:
  # --- Go Backend API ---
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      APP_PORT: "8080"
      DATABASE_URL: "postgres://postgres:password@postgres:5432/gotest_agent?sslmode=disable"
      REDIS_URL: "redis:6379"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      STEEL_API_URL: "http://steel-browser:3000"
      STEEL_API_KEY: "${STEEL_API_KEY:-}"
      LANGGRAPH_URL: "http://langgraph-sidecar:8000"
      API_KEY: "${API_KEY:-}"
      LLM_MODEL: "${LLM_MODEL:-claude-sonnet-4-5}"
      MAX_FIX_ATTEMPTS: "3"
      SCREENSHOTS_PATH: "/data/screenshots"
      REPORTS_PATH: "/data/reports"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - app_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 3

  # --- Next.js Frontend ---
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:8080"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 3

  # --- PostgreSQL ---
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gotest_agent
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      start_period: 5s
      retries: 5

  # --- Redis ---
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      start_period: 3s
      retries: 3

  # --- Steel Browser (self-hosted) ---
  steel-browser:
    image: ghcr.io/steel-dev/steel-browser:latest
    ports:
      - "3010:3000"
    environment:
      STEEL_API_PORT: "3000"
      MAX_CONCURRENT_SESSIONS: "10"
      SESSION_TIMEOUT: "300000"
      BLOCK_ADS: "true"
    volumes:
      - /dev/shm:/dev/shm
    shm_size: "2gb"
    cap_add:
      - SYS_ADMIN
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 3

  # --- LangGraph Python Sidecar ---
  langgraph-sidecar:
    build:
      context: ./sidecar
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      GOTEST_API_URL: "http://backend:8080"
      GOTEST_API_KEY: "${API_KEY:-}"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  pgdata:
  app_data:
