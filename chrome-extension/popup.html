<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>GoTest Agent Recorder</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🎬 GoTest Recorder</h1>
      <span id="status" class="status idle">Idle</span>
    </div>

    <div id="controls" class="controls">
      <div class="form-group">
        <label for="sessionName">Session Name</label>
        <input type="text" id="sessionName" placeholder="e.g., Login Flow" />
      </div>
      <div class="form-group">
        <label for="baseUrl">Target URL</label>
        <input type="text" id="baseUrl" placeholder="https://example.com" />
      </div>
      <button id="startBtn" class="btn btn-start">⏺ Start Recording</button>
      <button id="stopBtn" class="btn btn-stop" style="display:none">⏹ Stop Recording</button>
    </div>

    <div id="sessionInfo" class="session-info" style="display:none">
      <p><strong>Session:</strong> <span id="sessionNameDisplay"></span></p>
      <p><strong>ID:</strong> <code id="sessionId"></code></p>
    </div>

    <hr />

    <div class="sessions-section">
      <h3>Recent Sessions</h3>
      <div id="sessionList" class="session-list">
        <p class="empty">No sessions yet. Start recording!</p>
      </div>
    </div>

    <hr />

    <div class="settings-section">
      <h3>Settings</h3>
      <div class="form-group">
        <label for="backendUrl">Backend URL</label>
        <input type="text" id="backendUrl" placeholder="http://localhost:8080" />
      </div>
      <div class="form-group">
        <label for="apiKey">API Key</label>
        <input type="password" id="apiKey" placeholder="sk-..." />
      </div>
      <button id="saveSettings" class="btn btn-secondary">Save Settings</button>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
